<!DOCTYPE html>
<meta http-equiv="content-type" content="text/html; charset=utf-8">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>GymLap Schülerfirma Katalog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script/katalog.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    ::-webkit-scrollbar {
        width: 10px;
    }

    ::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
        background: #888;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
</style>
</head>

<body>
    <div class="header-div"><img src="img/gymlap_logo.png" class="header-ico">
        <h1>Schülerfirma Katalog</h1>
    </div>
    <div class="header-navdiv">
        <nav>
            <button class="btnoshop buttonbacknav" id="anfragen"
                onclick="document.location='index.html'">Zurück</button>
            <button id="corp" onclick="corp()"><i class="fa-solid fa-cart-shopping"></i>: 0</button>
        </nav>
    </div>
    <div class="katdiv">


        <!-- 0 HOODIE-->
        <div class="pr">
            <img src="img/0_black.jpg" class="product-img">
            <div>
                <p class="product-head" name="product_name" data-name="Hoodie">Hoodie - Unisex</p>
                <p name="price" data-price="13">Preis: 35€</p>
                <label for=size>Größe: </label>
                <select name="size" aria-label="Größe:">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                    <option value="3XL">3XL</option>
                    <option value="4XL">4XL</option>
                    <option value="5XL">5XL</option>
                </select>
                <br>
                <label for="color">Farbe: </label>
                <select name="color" onchange="changeColor(this, 0)">
                    <option value="black">black</option>
                    <option value="burgundy">burgundy</option>
                    <option value="navy">navy</option>
                    <option value="bottlegreen">bottlegreen</option>
                </select>
                <br>
                <label for="buy_count">Anzahl von Produkten: </label>
                <input type="number" name="buy_count" value="0" max="5" min="0" />
                <button onclick="add(this, 0)" class="btnoshop">Zum Warenkorb hinzufügen</button>
                <br>
            </div>
        </div>


        <!-- 1 TSHIRT-->
        <div class="pr">
            <img src="img/1_black.jpg" class="product-img">
            <div>
                <p class="product-head" name="product_name" data-name="T-shirt">T-Shirt</p>
                <p name="price" data-price="25">Preis: 25€</p>
                <label for=size>Größe: </label>
                <select name="size" aria-label="Größe:">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                    <option value="3XL">3XL</option>
                    <option value="4XL">4XL</option>
                    <option value="5XL">5XL</option>
                </select>
                <br>
                <label for="sex">Sexualität UwU: </label>
                <select name="sex">
                    <option value="K">Kinder</option>
                    <option value="M">Herren</option>
                    <option value="F">Frauen</option>
                </select>
                <br>
                <label for="color">Farbe: </label>
                <select name="color" onchange="changeColor(this, 1)">
                    <option value="black">black</option>
                    <option value="burgundy">burgundy</option>
                    <option value="navy">navy</option>
                    <option value="bottlegreen">bottlegreen</option>
                </select>
                <br>
                <label for="buy_count">Anzahl von Produkten: </label>
                <input type="number" name="buy_count" value="0" max="5" min="0" />
                <button onclick="add(this, 1)" class="btnoshop">Zum Warenkorb hinzufügen</button>
                <br>
            </div>
        </div>

                <select name="color" onchange="changeColor(this, 3)">
                    <option value="liniert">Liniert</option>

                <br>

            </div>

                <p class="product-head" name="product_name" data-name="Bleistift">Bleistift</p>
                <p name="price" data-price="1.5">Preis: 1,50€</p>
                <br>
                <label for="buy_count">Anzahl von Produkten: </label>
                <input type="number" name="buy_count" value="0" max="5" min="0" />

        </div>

                <p class="product-head" name="product_name" data-name="Trinkflasche">Trinkflasche</p>

                <label for="buy_count">Anzahl von Produkten: </label>

            </div>
        </div>

        <!-- 7 Trinkflasche-->
        <div class="pr">
            <img src="img/7.jpg" class="product-img">
            <div>
                <p class="product-head" name="product_name" data-name="Tasse">Tasse</p>
                <p name="price" data-price="13">Preis: 13€</p>
                <br>
                <label for="buy_count">Anzahl von Produkten: </label>
                <input type="number" name="buy_count" value="0" max="5" min="0" />
                <button onclick="add(this, 7)" class="btnoshop">Zum Warenkorb hinzufügen</button>
                <br>
            </div>
        </div>








    </div>
</body>

</html>
